    <!-- Meta Pixel base code (standard Meta snippet). It runs in the page itself so the pixel is initialised and the
         first PageView is sent as soon as the page loads. Not run on sign-in callback, password reset or dashboard
         pages, whose address can carry sign-in tokens. Later page changes inside the app: src/lib/metaPixel.ts -->
    <script>
      (function (w, d, path) {
        if (/^\/(auth|reset-password|forgot-password|admin|instructor)(\/|$)/i.test(path)) return;
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(w,d,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        w.fbq.disablePushState = true; // page changes inside the app are sent by the app (one PageView each)
        w.fbq('init', '2722451508224726');
        w.fbq('track', 'PageView');
        w.edufyPixelPageView = path;
      })(window, document, location.pathname);
    </script>
    <!-- Google Tag Manager (GTM-PD3JV5QC → Google Analytics 4). Same snippet as provided by Google, loaded on every
         page except the sign-in callback, password reset and dashboard pages (their address can carry sign-in codes).
         Page changes inside the app are recorded by the container's history-change trigger / GA4 enhanced measurement,
         so the app sends no page views of its own. -->
    <script>
      (function (w, d, path) {
        if (/^\/(auth|reset-password|forgot-password|admin|instructor)(\/|$)/i.test(path)) return;
        var s = d.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-PD3JV5QC';
        d.head.appendChild(s);
        w.dataLayer = w.dataLayer || [];
        function gtag() { w.dataLayer.push(arguments); }
        w.gtag = gtag;
        gtag('js', new Date());
      })(window, document, location.pathname);
    </script>
